<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Metaverse - High Speed Screen Streamer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .flex-row {
            display: flex;
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .grid-3 label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        button {
            padding: 14px 20px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #0f172a;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-success {
            background-color: var(--success);
            color: #0f172a;
        }

        .btn-success:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            border: 1px solid #334155;
            margin-top: 16px;
            max-height: 320px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 High-Speed Desktop Sender</h1>
        <p class="subtitle">Stream high-framerate desktop view to Unity AR/VR Metaverse app</p>

        <div id="statusBadge" class="status-badge">Status: Ready</div>

        <div class="form-group">
            <label for="wsAddressInput">Signaling Server Address (IP:Port)</label>
            <div class="flex-row">
                <input id="wsAddressInput" type="text" placeholder="e.g. 192.168.1.50:80" />
                <button id="applyWsBtn" class="btn-primary" style="width: auto; white-space: nowrap;">Connect</button>
            </div>
        </div>

        <div class="form-group">
            <label>Stream Bitrate Limits (kbps)</label>
            <div class="grid-3">
                <div>
                    <label>Lower / Min</label>
                    <input type="number" id="minBitrate" value="2500" step="500">
                </div>
                <div>
                    <label>Initial / Target</label>
                    <input type="number" id="targetBitrate" value="5000" step="500">
                </div>
                <div>
                    <label>Upper / Max</label>
                    <input type="number" id="maxBitrate" value="10000" step="500">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="contentHintSelect">Optimization Mode (Content Hint)</label>
            <select id="contentHintSelect">
                <option value="motion" selected>Motion (Prioritizes framerate/smoothness)</option>
                <option value="detail">Detail (Prioritizes crispness/resolution)</option>
                <option value="text">Text (Best for reading code/documents)</option>
            </select>
        </div>

        <video id="localVideo" autoplay playsinline muted></video>

        <div class="btn-group">
            <button id="startBtn" class="btn-primary">1. Capture Screen</button>
            <button id="connectBtn" class="btn-success" disabled>2. Stream to Unity</button>
        </div>
    </div>

    <script type="text/javascript" src="https://unpkg.com/@unity/webrtc@3.0.0-pre.4/dist/unity-webrtc.js"></script>

    <script>
        let localStream;
        let peerConnection;
        let ws;
        let hasSentOffer = false;
        let pendingLocalCandidates = [];
        let pendingRemoteCandidates = [];
        let reconnectTimer = null;
        const STORAGE_KEY = "ar_metaverse_signaling_url";
        const DEFAULT_ADDRESS = "127.0.0.1:80";

        const statusBadge = document.getElementById('statusBadge');
        const wsAddressInput = document.getElementById('wsAddressInput');
        const applyWsBtn = document.getElementById('applyWsBtn');
        const startBtn = document.getElementById('startBtn');
        const connectBtn = document.getElementById('connectBtn');
        
        const minBitrateInput = document.getElementById('minBitrate');
        const targetBitrateInput = document.getElementById('targetBitrate');
        const maxBitrateInput = document.getElementById('maxBitrate');
        const contentHintSelect = document.getElementById('contentHintSelect');

        // Load saved server URL
        const savedUrl = localStorage.getItem(STORAGE_KEY) || DEFAULT_ADDRESS;
        wsAddressInput.value = savedUrl;

        function updateStatus(text, type) {
            statusBadge.innerText = "Status: " + text;
            if (type === 'success') {
                statusBadge.style.color = "#22c55e";
                statusBadge.style.borderColor = "rgba(34, 197, 94, 0.4)";
                statusBadge.style.background = "rgba(34, 197, 94, 0.1)";
            } else if (type === 'error') {
                statusBadge.style.color = "#ef4444";
                statusBadge.style.borderColor = "rgba(239, 68, 68, 0.4)";
                statusBadge.style.background = "rgba(239, 68, 68, 0.1)";
            } else if (type === 'warning') {
                statusBadge.style.color = "#f59e0b";
                statusBadge.style.borderColor = "rgba(245, 158, 11, 0.4)";
                statusBadge.style.background = "rgba(245, 158, 11, 0.1)";
            } else {
                statusBadge.style.color = "#38bdf8";
                statusBadge.style.borderColor = "rgba(56, 189, 248, 0.4)";
                statusBadge.style.background = "rgba(56, 189, 248, 0.1)";
            }
        }

        function normalizeWsAddress(input) {
            let trimmed = (input || "").trim();
            if (!trimmed) trimmed = DEFAULT_ADDRESS;

            if (trimmed.startsWith("http://")) trimmed = "ws://" + trimmed.substring(7);
            else if (trimmed.startsWith("https://")) trimmed = "wss://" + trimmed.substring(8);
            else if (!trimmed.startsWith("ws://") && !trimmed.startsWith("wss://")) trimmed = "ws://" + trimmed;

            return trimmed;
        }

        function setHighBitrate(sdp, maxBitrateKbps) {
            let lines = sdp.split('\r\n');
            let newLines = [];
            
            for (let i = 0; i < lines.length; i++) {
                newLines.push(lines[i]);
                if (lines[i].indexOf('m=video') !== -1) {
                    newLines.push("b=AS:" + maxBitrateKbps);
                    newLines.push("b=TIAS:" + (maxBitrateKbps * 1000));
                }
            }
            return newLines.join('\r\n');
        }

        function connectWebSocket() {
            if (reconnectTimer) clearTimeout(reconnectTimer);

            const inputVal = wsAddressInput.value;
            const wsUrl = normalizeWsAddress(inputVal);
            localStorage.setItem(STORAGE_KEY, inputVal.trim());

            if (ws) {
                ws.onclose = null;
                ws.onerror = null;
                ws.close();
            }

            updateStatus("Connecting to " + wsUrl, 'warning');
            
            try {
                ws = new WebSocket(wsUrl);
            } catch (err) {
                updateStatus("Invalid WebSocket URL", 'error');
                return;
            }

            ws.onopen = () => {
                updateStatus("Signaling Server Connected", 'success');
            };

            ws.onmessage = async (message) => {
                try {
                    const parsed = JSON.parse(message.data);
                    
                    const targetId = parsed.data ? parsed.data.connectionId : (parsed.connectionId || parsed.from);
                    if (targetId && targetId !== 'windowsStream' && targetId !== 'screenshare') {
                        return; 
                    }

                    if (parsed.type === 'answer') {
                        if (!peerConnection) return;
                        await peerConnection.setRemoteDescription(new RTCSessionDescription({
                            type: 'answer', sdp: parsed.data.sdp
                        }));
                        while (pendingRemoteCandidates.length > 0) {
                            const cand = pendingRemoteCandidates.shift();
                            await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
                        }
                        updateStatus("Connected & Streaming Live to Unity!", 'success');
                    } else if (parsed.type === 'candidate') {
                        if (!peerConnection) return;
                        const cand = { candidate: parsed.data.candidate, sdpMid: parsed.data.sdpMid, sdpMLineIndex: parsed.data.sdpMLineIndex };
                        if (!peerConnection.remoteDescription) {
                            pendingRemoteCandidates.push(cand);
                        } else {
                            await peerConnection.addIceCandidate(new RTCIceCandidate(cand));
                        }
                    }
                } catch (e) {
                    console.error("Error processing signaling message:", e);
                }
            };

            ws.onerror = () => {
                updateStatus("Signaling Error (Check IP/Server)", 'error');
            };

            ws.onclose = () => {
                updateStatus("Connection Lost - Auto Reconnecting in 5s...", 'warning');
                reconnectTimer = setTimeout(connectWebSocket, 5000);
            };
        }

        applyWsBtn.onclick = () => connectWebSocket();
        connectWebSocket();

        startBtn.onclick = async () => {
            try {
                const targetFps = parseInt(maxBitrateInput.value, 10) >= 10000 ? 60 : 30;

                const constraints = {
                    video: {
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        frameRate: { ideal: targetFps, max: 60 },
                        displaySurface: "monitor"
                    },
                    audio: false
                };

                localStream = await navigator.mediaDevices.getDisplayMedia(constraints);

                // Apply the selected content hint (motion, detail, text)
                const selectedHint = contentHintSelect.value;
                localStream.getVideoTracks().forEach(track => {
                    if ('contentHint' in track) {
                        track.contentHint = selectedHint;
                    }
                });

                document.getElementById('localVideo').srcObject = localStream;
                connectBtn.disabled = false;
                updateStatus(`Screen Captured @ ~${targetFps} FPS (${selectedHint})`, 'info');
            } catch (e) {
                console.error(e);
                alert("Screen capture failed. Ensure HTTPS or localhost is used.");
            }
        };

        connectBtn.onclick = async () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert("Signaling server not connected!");
                return;
            }

            if (!localStream) return;

            peerConnection = new RTCPeerConnection({
                bundlePolicy: "max-bundle",
                rtcpMuxPolicy: "require"
            });

            hasSentOffer = false;
            pendingLocalCandidates = [];

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            const minBitrate = parseInt(minBitrateInput.value, 10) * 1000;
            const maxBitrate = parseInt(maxBitrateInput.value, 10) * 1000;

            const senders = peerConnection.getSenders();
            senders.forEach(sender => {
                if (sender.track && sender.track.kind === 'video') {
                    const params = sender.getParameters();
                    if (!params.encodings) params.encodings = [{}];
                    
                    // Apply bitrate limits to WebRTC encoding parameters
                    params.encodings[0].maxBitrate = maxBitrate;
                    
                    // NOTE: minBitrate isn't fully supported by all browsers via standard encoding parameters, 
                    // but we include it here where standardly applicable.
                    if ('minBitrate' in params.encodings[0]) {
                        params.encodings[0].minBitrate = minBitrate;
                    }
                    
                    sender.setParameters(params);
                }
            });

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    if (!hasSentOffer) {
                        pendingLocalCandidates.push(event.candidate);
                    } else {
                        ws.send(JSON.stringify({
                            type: 'candidate', from: 'windowsStream',
                            data: { candidate: event.candidate.candidate, sdpMid: event.candidate.sdpMid, sdpMLineIndex: event.candidate.sdpMLineIndex, connectionId: 'windowsStream' }
                        }));
                    }
                }
            };

            const offer = await peerConnection.createOffer();
            const maxBitrateKbps = parseInt(maxBitrateInput.value, 10);
            
            // Adjust SDP for the max upper bandwidth limit
            const highSpeedSdp = setHighBitrate(offer.sdp, maxBitrateKbps);

            await peerConnection.setLocalDescription({ type: 'offer', sdp: highSpeedSdp });

            ws.send(JSON.stringify({
                type: 'offer', 
                from: 'windowsStream',
                data: {
                    sdp: highSpeedSdp, 
                    type: 'offer',
                    polite: true,
                    connectionId: 'windowsStream'
                }
            }));

            hasSentOffer = true;
            pendingLocalCandidates.forEach(cand => {
                ws.send(JSON.stringify({
                    type: 'candidate', from: 'windowsStream',
                    data: { candidate: cand.candidate, sdpMid: cand.sdpMid, sdpMLineIndex: cand.sdpMLineIndex, connectionId: 'windowsStream' }
                }));
            });

            updateStatus("Negotiating WebRTC Link with Unity...", 'warning');
        };
    </script>
</body>
</html>
